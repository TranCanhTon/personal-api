# Production front door, behind the HTTPS proxy on the server.
# Serves the website and passes everything else to the API, so the API keeps
# its current URLs (/ingest/health, /days, /docs ...) on the same domain.

server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the API container up through Docker's DNS on every request (cached 10s),
    # so a recreated backend with a new IP doesn't leave nginx pointing at the old one
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8000;

    # Health Auto Export sends per minute data, which can be large
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;

    # The website
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built files have a hash in their name, so they can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # What the website calls: /api/days -> API /days
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    # Anything else: a static file if there is one (favicon), otherwise the API
    location / {
        try_files $uri @api;
    }
    location @api {
        proxy_pass $api;
    }
}
