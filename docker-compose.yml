services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [personal_net]

  backend:
    image: ghcr.io/trancanhton/personal-api-backend:${IMAGE_TAG:-latest}
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TIMEZONE: ${TIMEZONE:-Europe/Helsinki}
      INGEST_API_KEY: ${INGEST_API_KEY}
      NOTION_TOKEN: ${NOTION_TOKEN}
      NOTION_WEBHOOK_SECRET: ${NOTION_WEBHOOK_SECRET:-}
      NOTION_SYNC_INTERVAL_MINUTES: ${NOTION_SYNC_INTERVAL_MINUTES:-5}
      NOTION_SYNC_TRADES: ${NOTION_SYNC_TRADES:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [personal_net]

networks:
  personal_net:
    driver: bridge

volumes:
  db_data:
