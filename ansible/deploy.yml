- name: Deploy personal API
  hosts: web
  become: true

  vars:
    app_dir: /opt/personal-api
    repo_url: https://github.com/TranCanhTon/personal-api.git
    compose: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    image_tag: latest
    app_version: "{{ 'main' if image_tag == 'latest' else image_tag }}"

  tasks:
    - name: Get the code for this version
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ app_version }}"

    - name: Copy production env file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env.prod"
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Record which image version is live
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^IMAGE_TAG="
        line: "IMAGE_TAG={{ image_tag }}"

    - name: Copy the built website
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../frontend/dist/"
        dest: "{{ app_dir }}/frontend/dist/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Pull the prebuilt image
      ansible.builtin.command:
        cmd: "{{ compose }} pull backend"
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Start containers
      ansible.builtin.command:
        cmd: "{{ compose }} up -d --no-build --remove-orphans"
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

    # Picks up a changed nginx.conf (git replaces the file, which a running container won't see)
    - name: Restart the web server
      ansible.builtin.command:
        cmd: "{{ compose }} restart web"
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Wait for the API to respond
      ansible.builtin.uri:
        url: http://localhost:8000/health
        status_code: 200
      register: health
      until: health.status == 200
      retries: 30
      delay: 5

    - name: Check the website loads
      ansible.builtin.uri:
        url: http://localhost:8000/
        return_content: true
      register: site
      failed_when: "'<div id=\"root\">' not in site.content"

    - name: Remove images no container is using
      ansible.builtin.command: docker image prune -af
      register: prune
      changed_when: "'Total reclaimed space: 0B' not in prune.stdout"
