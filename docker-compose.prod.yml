# Production only. Used by Ansible together with docker-compose.yml.
services:
  # The API is no longer published on the host. web passes requests to it.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Same port the API used to have, so the HTTPS proxy on the server needs no change
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [personal_net]
